spring:
  ai:
    model:
      embedding: openai            # active OpenAI comme fournisseur d'embeddings
    openai:
      api-key: ${OPENAI_API_KEY}

    vectorstore:
      qdrant:
        host: localhost            # h?te de Qdrant
        port: 6334                 # port gRPC (par d?faut)
        collection-name: documents # nom de la collection
        initialize-schema: true    # cr?e la collection si besoin

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
# dossier o? d?poser vos fichiers avant upload (optionnel)
app:
  documents-dir: ./to-index
  #ai:
   #   chunk-size: 500               # taille des chunks (en tokens)
    #  chunk-overlap: 50             # recouvrement entre chunks (en tokens)
     # top-k: 5                      # nombre de r?ponses ? retourner
      #similarity-threshold: 0.75     # seuil de similarit? pour filtrer les r?ponses

#max-documents: 1000            # nombre maximum de documents ? indexer


# check for git rebase
logging:
  level:
    fr.gouv.vitamui: DEBUG
